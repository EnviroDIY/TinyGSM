# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
early_access: false
enable_free_tier: true
language: en
tone_instructions: ''
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
chat:
  auto_reply: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - '!**/dependencies.json'
    - '!**/cspell.json'
  path_instructions:
    - path: '**/*.md'
      instructions: >-
        Review for grammar, spelling, and clarity.
        Each sentence should be on a new line.
        Markdown files should follow rules of markdownlint.
        Check c++ and Arduino code snippets as c++ code.
    - path: '**/*.h'
      instructions: >-
        Review the C++ code, point out issues relative to principles of clean code, expressiveness, and performance.
        Since this is an Arduino project, never suggest using the standard library (std::).
        For memory savings, prefer defines to const variables, and prefer using the F() macro for string literals longer than a single character.
        Files should be formatted according to the .clang-format file in the repo.
        This is a header-only library; all code should be in the header and template files.
        Template files used as includes should have the .tpp extension, and should not be included directly by the user.
    - path: '**/*.tpp'
      instructions: >-
        Review the C++ code, point out issues relative to principles of clean code, expressiveness, and performance.
        Since this is an Arduino project, never suggest using the standard library (std::).
        For memory savings, prefer defines to const variables, and prefer using the F() macro for string literals longer than a single character.
        Files should be formatted according to the .clang-format file in the repo.
        This is a header-only library; all code should be in the header and template files.
        Template files used as includes should have the .tpp extension, and should not be included directly by the user.
    - path: '**/*.cpp'
      instructions: >-
        This is a header-only library, there should not be any .cpp files. If you see a .cpp file, it should be removed.
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      disabled_rules:
        - EN_UNPAIRED_BRACKETS
      disabled_categories:
        - TYPOS
        - TYPOGRAPHY
        - CASING
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
  auto_review:
    enabled: true
    ignore_title_keywords:
      - WIP
    labels: []
    drafts: true
    base_branches:
      - master
      - develop
